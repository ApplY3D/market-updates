<div class="scroll" role="region" aria-labelledby="instruments-caption" tabindex="0">
  <table>
    <caption id="instruments-caption">
      Instruments
      <span class="count">{{ rows().length }}</span>
    </caption>
    <thead>
      <tr>
        <th scope="col">Symbol</th>
        <th scope="col">Last price</th>
        <th scope="col">Spread</th>
        <th scope="col">Volume</th>
        <th scope="col">VWAP</th>
        <th scope="col">Imbalance</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.symbol) {
        <tr>
          <th scope="row">{{ row.symbol }}</th>
          <td><app-value [text]="row.lastPriceCents | usd" /></td>
          <td><app-value [text]="row.spreadCents | usd" /></td>
          <td><app-value [text]="row.volume | integer" /></td>
          <td><app-value [text]="row.vwapCents | usd" /></td>
          <td [attr.data-trend]="row.imbalance | trend">
            <app-value [text]="row.imbalance | imbalance" />
          </td>
        </tr>
      } @empty {
        <tr>
          <td class="empty" colspan="6">Waiting for market data…</td>
        </tr>
      }
    </tbody>
  </table>
</div>
