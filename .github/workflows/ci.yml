name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/market-gen
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:wasm
      - run: pnpm test
      - run: pnpm --filter web exec ng build --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages has no SPA rewrites; serving index.html as 404 makes deep links work.
      - run: cp web/dist/market-dashboard/browser/index.html web/dist/market-dashboard/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/market-dashboard/browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
